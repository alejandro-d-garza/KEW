[package]
name = "kew-desktop"
version = "0.2.0"
description = "Native desktop shell for Kew"
authors = ["Kew contributors"]
edition = "2021"

[lib]
name = "kew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
